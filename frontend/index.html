<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2>🚀 Sales Dashboard</h2>
    <span class="badge" id="pipelineBadge">CI/CD Ready</span>
  </nav>

  <div class="container">
    <section class="hero">
      <h1>Real-time Sales Analytics</h1>
      <p>Demo project for learning Azure Pipelines CI/CD</p>
    </section>

    <section class="metrics">
      <div class="metric">
        <h3>Total Sales</h3>
        <p class="value" id="sales">$0</p>
        <p class="subtext">All months</p>
      </div>
      <div class="metric">
        <h3>Total Profit</h3>
        <p class="value" id="profit">$0</p>
        <p class="subtext">All months</p>
      </div>
      <div class="metric">
        <h3>Status</h3>
        <p class="value" id="status">--</p>
        <p class="subtext">API connection</p>
      </div>
    </section>

    <section class="table-container">
      <h3>Monthly Sales</h3>
      <table id="salesTable">
        <thead>
          <tr><th>Month</th><th>Sales</th><th>Profit</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="3">Loading data...</td></tr>
        </tbody>
      </table>
    </section>

    <footer>
      <p>Sales Dashboard — Node.js + Express + Vanilla JS</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
